name: AWS Security Check

on:
  # Scheduled runs always execute on the repository's default branch (main),
  # which is why the IAM trust policy can pin the `sub` claim to refs/heads/main.
  # GitHub cron is always UTC. 06:00 UTC daily.
  schedule:
    - cron: "0 6 * * *"
  # Allows triggering a run by hand from the Actions tab or `gh workflow run`.
  workflow_dispatch:

# Least privilege applies to the GITHUB_TOKEN too, not just to AWS:
#   id-token: write  -> REQUIRED. Without it the runner cannot mint the OIDC
#                       JWT that AWS exchanges for temporary credentials.
#                       Its absence is the most common cause of
#                       "Credentials could not be loaded" in this setup.
#   contents: read   -> needed by actions/checkout to fetch the script.
permissions:
  id-token: write
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # No aws-access-key-id / aws-secret-access-key anywhere. The action
          # calls sts:AssumeRoleWithWebIdentity with the GitHub-issued JWT and
          # receives short-lived credentials scoped to this role alone.
          role-to-assume: arn:aws:iam::020502037769:role/GitHubActionsSecurityCheckRole
          role-session-name: gha-security-check
          # IAM is a global service and the billing-alarm check hardcodes
          # us-east-1, so us-east-1 is the right home region for this job.
          aws-region: us-east-1

      - name: Verify assumed identity
        # sts:GetCallerIdentity requires no IAM permission, so this step
        # separates authentication failures from authorization failures.
        run: aws sts get-caller-identity

      - name: Run security & cost hygiene check
        run: |
          chmod +x ./setup-aws-security.sh
          ./setup-aws-security.sh
